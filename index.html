<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BioInput Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================= TOKENS ============================= */
:root{
  --paper:      #F2F1E6;
  --surface:    #FBFAF4;
  --surface-2:  #EFEEE0;
  --ink:        #21261D;
  --ink-soft:   #565C4C;
  --muted:      #8B9078;
  --line:       #DCDCC9;
  --line-soft:  #E7E6D8;
  --accent:     #B96A15;
  --accent-ink: #6E3E0C;
  --accent-soft:#F0DCC1;
  --crop:       #3F6B34;
  --crop-soft:  #DDE7D3;
  --sky:        #2B4C6F;
  --sky-soft:   #DAE3EC;

  --good:       #0ca30c;
  --warning:    #b8790f;
  --serious:    #c1592f;
  --critical:   #b3342f;

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --div-pos:#2a78d6; --div-neg:#e34948; --div-mid:#f0efec;

  --shadow: 0 1px 2px rgba(33,38,29,0.06), 0 6px 20px -8px rgba(33,38,29,0.18);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:      #14160F;
    --surface:    #1B1E14;
    --surface-2:  #21241A;
    --ink:        #ECEEE2;
    --ink-soft:   #ABB098;
    --muted:      #7B8069;
    --line:       #33382A;
    --line-soft:  #292E20;
    --accent:     #E3A64A;
    --accent-ink: #F6D9A6;
    --accent-soft:#3A2E17;
    --crop:       #7CB36B;
    --crop-soft:  #23301E;
    --sky:        #7FA8CF;
    --sky-soft:   #1D2A38;

    --good:       #0ca30c;
    --warning:    #d99a1e;
    --serious:    #ec835a;
    --critical:   #e66767;

    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#3fbf3f; --s7:#9085e9; --s8:#e66767;
    --div-pos:#3987e5; --div-neg:#e66767; --div-mid:#383835;

    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -10px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:      #14160F;
  --surface:    #1B1E14;
  --surface-2:  #21241A;
  --ink:        #ECEEE2;
  --ink-soft:   #ABB098;
  --muted:      #7B8069;
  --line:       #33382A;
  --line-soft:  #292E20;
  --accent:     #E3A64A;
  --accent-ink: #F6D9A6;
  --accent-soft:#3A2E17;
  --crop:       #7CB36B;
  --crop-soft:  #23301E;
  --sky:        #7FA8CF;
  --sky-soft:   #1D2A38;

  --good:       #0ca30c;
  --warning:    #d99a1e;
  --serious:    #ec835a;
  --critical:   #e66767;

  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#3fbf3f; --s7:#9085e9; --s8:#e66767;
  --div-pos:#3987e5; --div-neg:#e66767; --div-mid:#383835;

  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -10px rgba(0,0,0,0.5);
  color-scheme: dark;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:"Bricolage Grotesque", "Public Sans", sans-serif;
  font-weight:700;
  text-wrap:balance;
  margin:0;
  letter-spacing:-0.01em;
}
.mono, .num{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
a{color:var(--accent);}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}

/* ============================= LAYOUT ============================= */
.app{
  display:grid;
  grid-template-columns: 372px minmax(0,1fr);
  min-height:100vh;
}
.app > *{min-width:0;}
@media (max-width: 980px){
  .app{grid-template-columns: minmax(0,1fr);}
}

.sidebar{
  background:var(--surface);
  border-right:1px solid var(--line);
  padding:22px 20px 40px;
  position:sticky; top:0; align-self:start;
  max-height:100vh; overflow-y:auto;
}
@media (max-width: 980px){
  .sidebar{position:static; max-height:none; overflow-y:visible;}
}
.brand{
  display:flex; align-items:center; gap:10px;
  margin-bottom:4px;
}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg, var(--crop), var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-size:17px; flex:none;
  box-shadow: var(--shadow);
}
.brand h1{font-size:19px;}
.brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}

.field-note{
  font-size:12px; color:var(--ink-soft); margin:10px 0 18px;
  padding:9px 11px; background:var(--surface-2); border-radius:8px;
  border:1px solid var(--line-soft);
}

.section{margin-top:22px;}
.section-head{
  display:flex; align-items:center; justify-content:space-between;
  cursor:pointer; user-select:none;
  padding-bottom:7px; border-bottom:1px solid var(--line);
  margin-bottom:12px;
}
.section-head h2{
  font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-soft); font-family:"Public Sans",sans-serif; font-weight:700;
}
.section-head .chev{color:var(--muted); font-size:11px; transition:transform .15s ease;}
.section.collapsed .chev{transform:rotate(-90deg);}
.section.collapsed .section-body{display:none;}

.row{display:flex; gap:10px; align-items:flex-end;}
.field{margin-bottom:12px;}
.field label{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;
}
.field label .val{font-family:"IBM Plex Mono",monospace; color:var(--accent-ink); font-weight:600; font-size:12px;}
select, input[type=number], input[type=text]{
  width:100%; padding:8px 9px; border-radius:7px;
  border:1px solid var(--line); background:var(--surface);
  color:var(--ink); font-size:13.5px; font-family:inherit;
}
input[type=number]{font-family:"IBM Plex Mono",monospace;}
select:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px;}
input[type=range]{
  width:100%; accent-color:var(--accent); height:18px; cursor:pointer;
}
.unit-input{position:relative;}
.unit-input .suffix{
  position:absolute; right:9px; top:50%; transform:translateY(-50%);
  font-size:11.5px; color:var(--muted); pointer-events:none;
}
.field-2col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

.chip-group{display:flex; flex-wrap:wrap; gap:6px;}
.chip{
  border:1px solid var(--line); background:var(--surface);
  border-radius:999px; padding:6px 11px; font-size:12.5px; font-weight:600;
  cursor:pointer; color:var(--ink-soft); transition:all .12s ease;
}
.chip:hover{border-color:var(--accent);}
.chip.active{
  background:var(--accent); border-color:var(--accent); color:#fff;
}

.preset-card{
  border:1px solid var(--line); border-radius:9px; padding:11px 12px;
  cursor:pointer; margin-bottom:8px; background:var(--surface);
  transition: border-color .12s ease, background .12s ease;
}
.preset-card:hover{border-color:var(--accent);}
.preset-card.active{
  border-color:var(--accent); background:var(--accent-soft);
}
.preset-card .pt{font-weight:700; font-size:13.5px;}
.preset-card .ps{font-size:11.5px; color:var(--muted); margin-top:2px;}

.crop-info{
  border:1px solid var(--line-soft); background:var(--surface-2); border-radius:9px;
  padding:10px 12px; margin:-2px 0 14px; font-size:12px;
}
.crop-info .ci-top{margin-bottom:5px;}
.crop-info .ci-note{color:var(--ink-soft); margin-bottom:6px;}
.crop-info .ci-link{
  display:inline-block; font-size:11.5px; color:var(--accent-ink); text-decoration:none;
  border-bottom:1px dotted var(--accent-ink); margin-bottom:6px; word-break:break-word;
}
.crop-info .ci-link:hover{opacity:0.75;}
.crop-info .ci-caveat{
  font-size:11px; color:var(--muted); line-height:1.5; padding-top:6px; border-top:1px dashed var(--line);
}

.item-divider{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
  color:var(--muted); margin:16px 0 8px; padding-top:12px; border-top:1px dashed var(--line);
}
.item-editor{
  border:1px solid var(--line-soft); background:var(--surface-2); border-radius:9px;
  padding:10px; margin-bottom:10px;
}
.item-editor-title{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:7px;}
.item-list{display:flex; flex-direction:column; gap:5px; margin-bottom:6px;}
.item-row{
  display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1.15fr) 78px 22px;
  gap:5px; align-items:center;
}
.item-row select.item-cat, .item-row input.item-name, .item-row input.item-amt{
  width:100%; min-width:0; padding:5px 6px; font-size:11.5px;
  border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink);
}
.item-row input.item-amt{font-family:"IBM Plex Mono",monospace; text-align:right;}
.item-row select.item-cat{color:var(--ink-soft); font-size:11px;}
.item-del{
  border:none; background:transparent; color:var(--muted); font-size:16px; line-height:1;
  cursor:pointer; padding:2px; border-radius:5px; justify-self:center;
}
.item-del:hover{color:var(--status-bad, #c0392b); background:var(--surface);}
.item-add-row{margin-top:2px;}
.item-add-row select.item-cat, .item-add-row input.item-name, .item-add-row input.item-amt{
  border-style:dashed;
}
.item-add-btn{
  border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px;
  font-size:11px; font-weight:700; cursor:pointer; padding:5px 4px;
}
.item-add-btn:hover{opacity:.85;}
.item-total{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:12px; font-weight:700; color:var(--ink); padding-top:7px;
  border-top:1px solid var(--line-soft); margin-top:2px;
}
.item-total .hint{font-weight:500; font-size:10.5px;}

.reset-btn{
  width:100%; margin-top:18px; padding:10px; border-radius:8px;
  border:1px dashed var(--line); background:transparent; color:var(--ink-soft);
  font-size:12.5px; font-weight:600; cursor:pointer;
}
.reset-btn:hover{border-color:var(--accent); color:var(--accent-ink);}

.io-row{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:8px;}
.io-btn{
  padding:8px 6px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-soft); font-size:11.5px; font-weight:600; cursor:pointer; text-align:center;
}
.io-btn:hover{border-color:var(--accent); color:var(--accent-ink);}
.io-btn-wide{width:100%; margin-top:7px;}
.io-status{font-size:11px; color:var(--muted); margin-top:6px; min-height:14px;}
.io-status.ok{color:var(--good, #2e7d32);}
.io-status.err{color:var(--critical, #c0392b);}

/* ============================= MAIN ============================= */
.main{padding:26px 32px 60px; max-width:1200px;}
.topbar{
  display:flex; align-items:baseline; justify-content:space-between;
  flex-wrap:wrap; gap:10px; margin-bottom:6px;
}
.topbar .scenario{
  font-size:13px; color:var(--ink-soft);
}
.topbar .scenario b{color:var(--ink); font-weight:700;}

.tabs{
  display:flex; gap:2px; margin:18px 0 22px; border-bottom:1px solid var(--line);
  overflow-x:auto;
}
.tab-btn{
  padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
  background:none; border:none; cursor:pointer; white-space:nowrap;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--accent-ink); border-bottom-color:var(--accent);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow);
}
.card + .card{margin-top:16px;}
.card h3{font-size:15px; margin-bottom:3px;}
.card .sub{font-size:12px; color:var(--muted); margin-bottom:14px;}

.grid-4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px;}
.grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px;}
.grid-2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px;}
.two-col{display:grid; grid-template-columns:1.1fr 1fr; gap:16px;}
.two-col > *{min-width:0;}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} .grid-3{grid-template-columns:minmax(0,1fr);} .grid-2{grid-template-columns:minmax(0,1fr);} .two-col{grid-template-columns:minmax(0,1fr);}}

.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 16px; position:relative; overflow:hidden; box-shadow:var(--shadow);
}
.stat::before{
  content:""; position:absolute; inset:0 0 auto 0; height:3px;
  background:var(--stat-color, var(--accent));
}
.stat .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700;}
.stat .v{font-family:"Bricolage Grotesque",sans-serif; font-size:26px; font-weight:700; margin-top:6px; font-variant-numeric:tabular-nums;}
.stat .v.pos{color:var(--good);}
.stat .v.neg{color:var(--critical);}
.stat .foot{font-size:11.5px; color:var(--ink-soft); margin-top:5px;}
.pill{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  padding:3px 8px; border-radius:999px; margin-top:8px;
}
.pill.good{background:color-mix(in oklab, var(--good) 16%, transparent); color:var(--good);}
.pill.bad{background:color-mix(in oklab, var(--critical) 16%, transparent); color:var(--critical);}
.pill::before{content:"●"; font-size:8px;}

table{border-collapse:collapse; width:100%; font-size:12.5px;}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:9px;}
th,td{padding:7px 10px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line-soft);}
th:first-child,td:first-child{text-align:left; position:sticky; left:0; background:inherit;}
thead th{
  background:var(--surface-2); color:var(--ink-soft); font-weight:700; font-size:11px;
  text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0; z-index:2;
}
thead th:first-child{z-index:3;}
tbody tr:nth-child(even){background:color-mix(in oklab, var(--surface-2) 45%, transparent);}
tbody tr:hover{background:var(--accent-soft);}
tbody tr.year-0 td{font-weight:700; border-bottom:2px solid var(--line);}
tbody tr.final td{font-weight:700; border-top:2px solid var(--line);}
td.neg{color:var(--critical);}
td.pos-strong{color:var(--good); font-weight:700;}

.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--ink-soft); margin-top:10px;}
.legend .li{display:flex; align-items:center; gap:6px;}
.legend .sw{width:10px;height:10px;border-radius:3px; flex:none;}

.info-note{
  display:flex; gap:9px; font-size:12.5px; color:var(--ink-soft);
  background:var(--surface-2); border:1px solid var(--line-soft); border-radius:8px;
  padding:10px 12px; margin-top:14px;
}
.info-note .ic{flex:none;}

/* sensitivity + tornado */
.param-picker{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.tornado-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line-soft);}
.tornado-row:last-child{border-bottom:none;}
.tornado-row .pname{width:150px; flex:none; font-size:12.5px; font-weight:600;}
.tornado-row .track{flex:1; position:relative; height:22px;}
.tornado-row .val{width:150px; flex:none; font-size:11.5px; color:var(--ink-soft); text-align:right;}

.goalseek-result{
  display:flex; align-items:center; gap:14px; padding:14px 16px;
  background:var(--surface-2); border-radius:9px; border:1px solid var(--line-soft);
}
.goalseek-result .big{font-family:"Bricolage Grotesque",sans-serif; font-size:24px; font-weight:700;}

.btn{
  padding:9px 16px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-weight:700; font-size:13px; cursor:pointer;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn:hover{filter:brightness(0.97);}
.btn.primary:hover{filter:brightness(1.06);}

.hint{font-size:12px; color:var(--muted);}
.kbd-note{font-size:11.5px;color:var(--muted); margin-top:4px;}

.badge{
  display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.04em; padding:2px 7px; border-radius:5px;
  background:var(--sky-soft); color:var(--sky);
}
.badge.crop{background:var(--crop-soft); color:var(--crop);}

svg text{font-family:"Public Sans",sans-serif;}
svg .num-lbl{font-family:"IBM Plex Mono",monospace;}

footer.credits{margin-top:34px; font-size:11.5px; color:var(--muted); line-height:1.7;}
</style>
</head>
<body>
<style>
body{background:var(--paper);}
.shell{max-width:1320px; margin:0 auto; padding:0 28px 60px;}
.hdr{position:sticky; top:0; z-index:20; background:color-mix(in oklab, var(--paper) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); margin:0 -28px 24px; padding:12px 28px;}
.hdr-in{max-width:1320px; margin:0 auto; display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
.logo{display:flex; align-items:center; gap:10px; font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:18px; color:var(--ink);}
.logo .mk{width:32px; height:32px; border-radius:9px; display:grid; place-items:center; background:linear-gradient(135deg,var(--good),var(--accent)); color:#fff; font-size:16px;}
.steps{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:12px; border:1px solid var(--line);}
.steps button{border:none; background:none; padding:8px 14px; border-radius:9px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; gap:7px;}
.steps button .n{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:11px; background:var(--line); color:var(--ink-soft);}
.steps button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08);}
.steps button.on .n{background:var(--accent); color:#fff;}
.glob{margin-left:auto; display:flex; gap:12px; align-items:center;}
.glob label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; align-items:center; gap:6px;}
.glob input{width:64px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; font-family:"IBM Plex Mono",monospace; font-size:13px; background:var(--surface); color:var(--ink); text-align:right;}
.page{display:none;} .page.on{display:block;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-bottom:18px; box-shadow:0 1px 2px rgba(0,0,0,.03);}
.card h3{margin:0 0 14px; font-family:"Bricolage Grotesque",sans-serif; font-size:16px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:10px;}
.card h3 .sp{flex:1;}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;}
.btn:hover{border-color:var(--accent);}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.ghost{border-style:dashed; color:var(--ink-soft);}

<script>
function fmt$(v, {compact=false, cents=false}={}){
  if(!Number.isFinite(v)) return 'n/a';
  const neg = v < 0; const a = Math.abs(v);
  let s;
  if(compact){
    if(a>=1e6) s = (a/1e6).toFixed(a>=10e6?1:2)+'M';
    else if(a>=1e3) s = (a/1e3).toFixed(a>=10e3?0:1)+'k';
    else s = a.toFixed(a<10 && a!==0 ? 1 : 0);
  } else {
    s = a.toLocaleString('en-US', {minimumFractionDigits:cents?2:0, maximumFractionDigits:cents?2:0});
  }
  return (neg?'−$':'$')+s;
}
function fmtPct(v, d=1){ return Number.isFinite(v) ? (v*100).toFixed(d)+'%' : 'n/a'; }
function fmtNum(v, d=0){ return Number.isFinite(v) ? v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}) : 'n/a'; }
function priceUnit(inp){ return inp.priceMode==='perHa' ? '/ha·season' : inp.priceMode==='perApp' ? '/'+inp.rateUnit : '/kg'; }
function fmtPrice(v, inp){
  if(!Number.isFinite(v)) return 'n/a';
  const cents = inp.priceMode!=='perHa' && Math.abs(v) < 1000;
  return fmt$(v,{cents}) + priceUnit(inp);
}
function fmtBC(v){ return Number.isFinite(v) ? v.toFixed(2)+' : 1' : '∞'; }


const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs={}, children=[]){
  const n = document.createElementNS(NS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  for(const c of children) n.appendChild(c);
  return n;
}
function textEl(x,y,str,attrs={}){ const t = el('text', {x, y, ...attrs}); t.textContent = str; return t; }
function niceStep(range, targetTicks=5){
  if(!(range>0)) return 1;
  const raw = range/targetTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw/mag;
  let step;
  if(norm < 1.5) step = 1; else if(norm < 3) step = 2; else if(norm < 7) step = 5; else step = 10;
  return step*mag;
}
let tooltipEl = null;
function ensureTooltip(){
  if(tooltipEl) return tooltipEl;
  tooltipEl = document.createElement('div');
  tooltipEl.style.cssText = `position:fixed; pointer-events:none; z-index:999; background:var(--ink); color:var(--paper);
    font-size:12px; padding:7px 10px; border-radius:7px; box-shadow:var(--shadow); opacity:0; transition:opacity .08s ease;
    font-family:"Public Sans",sans-serif; max-width:240px; line-height:1.45;`;
  document.body.appendChild(tooltipEl);
  return tooltipEl;
}
function showTip(evt, html){
  const tip = ensureTooltip();
  tip.innerHTML = html; tip.style.opacity = '1';
  let x = evt.clientX + 14, y = evt.clientY + 14;
  if(x + 250 > window.innerWidth) x = evt.clientX - 254;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
function hideTip(){ if(tooltipEl) tooltipEl.style.opacity='0'; }
function bindTip(node, html){ node.addEventListener('mousemove', e=>showTip(e, html)); node.addEventListener('mouseleave', hideTip); }

/**
 * Generic numeric-x line chart. series: [{name, ys, color, dash}].
 * markers: [{x, label, color}] vertical dashed lines. band: {x0, x1, color}.
 */
function drawLines(container, {xs, series, xFmt=v=>v, yFmt=v=>fmt$(v,{compact:true}), tipY=v=>fmt$(v), xLabel='', markers=[], band=null, baseX=null, height=300, zeroLine=true}){
  container.innerHTML='';
  const W = container.clientWidth || 760, H = height;
  const M = {top:22, right:24, bottom:46, left:74};
  const iw = W-M.left-M.right, ih = H-M.top-M.bottom;
  const svg = el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,role:'img'});
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const allY = series.flatMap(s=>s.ys).filter(Number.isFinite);
  if(zeroLine) allY.push(0);
  let minV = Math.min(...allY), maxV = Math.max(...allY);
  if(minV===maxV){ minV -= 1; maxV += 1; }
  const step = niceStep(maxV-minV, 5);
  const yMin = Math.floor(minV/step)*step, yMax = Math.ceil(maxV/step)*step;
  const xScale = v => M.left + iw*((v-xMin)/((xMax-xMin)||1));
  const yScale = v => M.top + ih - ((v-yMin)/((yMax-yMin)||1))*ih;

  if(band && Number.isFinite(band.x0) && Number.isFinite(band.x1) && band.x1>band.x0){
    const a = Math.max(xMin, band.x0), b = Math.min(xMax, band.x1);
    if(b>a) svg.appendChild(el('rect',{x:xScale(a), y:M.top, width:xScale(b)-xScale(a), height:ih, fill:band.color||'var(--good)', opacity:0.10}));
  }
  for(let gv=yMin; gv<=yMax+step*1e-6; gv+=step){
    const gy = yScale(gv);
    svg.appendChild(el('line',{x1:M.left,x2:W-M.right,y1:gy,y2:gy,stroke:'var(--line-soft)','stroke-width':1}));
    svg.appendChild(textEl(M.left-8, gy+4, yFmt(gv), {'text-anchor':'end','font-size':10.5, fill:'var(--muted)', class:'num-lbl'}));
  }
  if(zeroLine && yMin<0 && yMax>0){
    svg.appendChild(el('line',{x1:M.left,x2:W-M.right,y1:yScale(0),y2:yScale(0),stroke:'var(--muted)','stroke-width':1.3}));
  }
  const xStep = niceStep(xMax-xMin, Math.max(3, Math.min(8, Math.floor(iw/80))));
  for(let tv=Math.ceil(xMin/xStep-1e-9)*xStep; tv<=xMax+xStep*1e-6; tv+=xStep){
    const tx = xScale(tv);
    svg.appendChild(el('line',{x1:tx,x2:tx,y1:M.top+ih,y2:M.top+ih+4,stroke:'var(--muted)'}));
    svg.appendChild(textEl(tx, M.top+ih+17, xFmt(tv), {'text-anchor':'middle','font-size':10.5, fill:'var(--muted)'}));
  }
  svg.appendChild(el('line',{x1:M.left,x2:W-M.right,y1:M.top+ih,y2:M.top+ih,stroke:'var(--line)'}));

  markers.forEach((mk,k)=>{
    if(!Number.isFinite(mk.x) || mk.x<xMin || mk.x>xMax) return;
    const mx = xScale(mk.x);
    svg.appendChild(el('line',{x1:mx,x2:mx,y1:M.top,y2:M.top+ih,stroke:mk.color||'var(--accent)','stroke-width':1.4,'stroke-dasharray':'4 3'}));
    const anchor = mx > W-150 ? 'end' : 'start';
    svg.appendChild(textEl(mx + (anchor==='end'?-5:5), M.top+11+k*13, mk.label, {'font-size':10.5, fill:mk.color||'var(--accent-ink)', 'text-anchor':anchor, 'font-weight':600}));
  });

  series.forEach(s=>{
    let d='', pen=false;
    xs.forEach((x,i)=>{
      const y = s.ys[i];
      if(!Number.isFinite(y)){ pen=false; return; }
      d += (pen?'L ':'M ')+xScale(x)+' '+yScale(y)+' '; pen=true;
    });
    svg.appendChild(el('path',{d, fill:'none', stroke:s.color, 'stroke-width':2.3, 'stroke-linejoin':'round', 'stroke-dasharray':s.dash||''}));
  });
  // hover columns
  xs.forEach((x,i)=>{
    const cx = xScale(x);
    series.forEach(s=>{
      const y = s.ys[i]; if(!Number.isFinite(y)) return;
      const isBase = baseX!=null && Math.abs(x-baseX) < 1e-9;
      svg.appendChild(el('circle',{cx, cy:yScale(y), r:isBase?5:3, fill:isBase?'var(--accent)':'var(--surface)', stroke:s.color, 'stroke-width':1.8}));
    });
    const hw = (iw/Math.max(xs.length-1,1))/2;
    const hit = el('rect',{x:cx-hw, y:M.top, width:hw*2, height:ih, fill:'transparent'});
    bindTip(hit, `<b>${xFmt(x)}</b>${baseX!=null && Math.abs(x-baseX)<1e-9?' (base case)':''}<br>` + series.map(s=>`${s.name}: ${tipY(s.ys[i], s)}`).join('<br>'));
    svg.appendChild(hit);
  });
  svg.appendChild(textEl(M.left+iw/2, H-6, xLabel, {'text-anchor':'middle','font-size':11,fill:'var(--ink-soft)','font-weight':600}));
  container.appendChild(svg);
}

/** Waterfall: steps [{label, v}] then a total bar. */
function drawWaterfall(container, steps, totalLabel='AEV'){
  container.innerHTML='';
  const W = container.clientWidth || 600, H = 300;
  const M = {top:22, right:14, bottom:58, left:64};
  const iw = W-M.left-M.right, ih = H-M.top-M.bottom;
  const svg = el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'Annual equivalent value waterfall'});
  let run = 0; const bars = [];
  steps.forEach(s=>{ bars.push({label:s.label, a:run, b:run+s.v, v:s.v}); run += s.v; });
  bars.push({label:totalLabel, a:0, b:run, v:run, total:true});
  const vals = bars.flatMap(b=>[b.a,b.b]).concat(0);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const step = niceStep((maxV-minV)||1, 5);
  const yMin = Math.floor(minV/step)*step, yMax = Math.ceil(maxV/step)*step;
  const yScale = v => M.top + ih - ((v-yMin)/((yMax-yMin)||1))*ih;
  for(let gv=yMin; gv<=yMax+step*1e-6; gv+=step){
    const gy = yScale(gv);
    svg.appendChild(el('line',{x1:M.left,x2:W-M.right,y1:gy,y2:gy,stroke:'var(--line-soft)'}));
    svg.appendChild(textEl(M.left-8, gy+4, fmt$(gv,{compact:true}), {'text-anchor':'end','font-size':10.5,fill:'var(--muted)',class:'num-lbl'}));
  }
  svg.appendChild(el('line',{x1:M.left,x2:W-M.right,y1:yScale(0),y2:yScale(0),stroke:'var(--muted)','stroke-width':1.3}));
  const slot = iw/bars.length, bw = Math.min(slot*0.62, 70);
  bars.forEach((b,i)=>{
    const cx = M.left + slot*(i+0.5);
    const y1 = yScale(Math.max(b.a,b.b)), y2 = yScale(Math.min(b.a,b.b));
    const color = b.total ? (b.v>=0?'var(--good)':'var(--critical)') : (b.v>=0?'var(--div-pos)':'var(--div-neg)');
    const r = el('rect',{x:cx-bw/2, y:y1, width:bw, height:Math.max(y2-y1,1.5), rx:3, fill:color, opacity:b.total?1:0.88});
    bindTip(r, `<b>${b.label}</b><br>${fmt$(b.v)} /ha·yr`);
    svg.appendChild(r);
    if(i < bars.length-1){
      const nx = M.left + slot*(i+1.5);
      svg.appendChild(el('line',{x1:cx+bw/2, x2:nx-bw/2, y1:yScale(b.b), y2:yScale(b.b), stroke:'var(--muted)', 'stroke-dasharray':'2 2'}));
    }
    svg.appendChild(textEl(cx, y1-5, fmt$(b.v,{compact:true}), {'text-anchor':'middle','font-size':10.5,fill:'var(--ink-soft)',class:'num-lbl','font-weight':b.total?700:500}));
    // wrapped label
    const words = b.label.split(' '); const lines=[''];
    words.forEach(w=>{ if((lines[lines.length-1]+' '+w).trim().length > Math.max(8, Math.floor(slot/6.2))) lines.push(w); else lines[lines.length-1] = (lines[lines.length-1]+' '+w).trim(); });
    lines.slice(0,3).forEach((ln,k)=> svg.appendChild(textEl(cx, M.top+ih+15+k*12, ln, {'text-anchor':'middle','font-size':10.2,fill:b.total?'var(--ink)':'var(--muted)','font-weight':b.total?700:400})));
  });
  container.appendChild(svg);
}

/** Heatmap of AEV over a 2-D grid. z[yi][xi]. */
function drawHeatmap(container, {xs, ys, z, xFmt, yFmt, xLabel, yLabel, baseX, baseY}){
  container.innerHTML='';
  const W = container.clientWidth || 760;
  const M = {top:10, right:16, bottom:46, left:92};
  const iw = W-M.left-M.right;
  const cw = iw/xs.length, ch = Math.max(24, Math.min(34, cw*0.6));
  const H = M.top + M.bottom + ch*ys.length;
  const svg = el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'AEV heatmap'});
  const maxAbs = Math.max(...z.flat().map(v=>Math.abs(v)).filter(Number.isFinite), 1);
  const nearest = (arr,v)=> arr.reduce((bi,a,i)=> Math.abs(a-v)<Math.abs(arr[bi]-v)?i:bi, 0);
  const bxi = nearest(xs, baseX), byi = nearest(ys, baseY);
  ys.forEach((yv, yi)=>{
    const ry = M.top + (ys.length-1-yi)*ch;
    svg.appendChild(textEl(M.left-8, ry+ch/2+4, yFmt(yv), {'text-anchor':'end','font-size':10.5,fill:'var(--muted)'}));
    xs.forEach((xv, xi)=>{
      const v = z[yi][xi];
      const t = Math.min(1, Math.abs(v)/maxAbs);
      const rx = M.left + xi*cw;
      svg.appendChild(el('rect',{x:rx, y:ry, width:cw, height:ch, fill:'var(--div-mid)'}));
      const cell = el('rect',{x:rx+0.5, y:ry+0.5, width:cw-1, height:ch-1, fill: v>=0?'var(--div-pos)':'var(--div-neg)', opacity:(0.12+0.85*t).toFixed(3)});
      bindTip(cell, `<b>${xLabel}: ${xFmt(xv)}</b><br>${yLabel}: ${yFmt(yv)}<br>AEV: ${fmt$(v)} /ha·yr`);
      svg.appendChild(cell);
      if(cw >= 44) svg.appendChild(textEl(rx+cw/2, ry+ch/2+4, fmt$(v,{compact:true}), {'text-anchor':'middle','font-size':10, fill: t>0.55?'#fff':'var(--ink)', class:'num-lbl', 'pointer-events':'none'}));
      if(xi===bxi && yi===byi) svg.appendChild(el('rect',{x:rx+1.5,y:ry+1.5,width:cw-3,height:ch-3,fill:'none',stroke:'var(--accent)','stroke-width':2.5,rx:3,'pointer-events':'none'}));
    });
  });
  const every = Math.ceil(xs.length / Math.max(1, Math.floor(iw/58)));

function h(tag, attrs={}, html=''){
  const n = document.createElement(tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  n.innerHTML = html;
  return n;
}
function numField(container, {label, get, set, min, max, step=1, suffix='', isPct=false, digits=null, onInput=null}){
  const wrap = h('div',{class:'field'});
  const showVal = ()=> isPct ? fmtPct(get(), digits==null?1:digits) : (digits!=null? fmtNum(get(),digits) : fmtNum(get(),0));
  const lab = h('label',{}, `<span>${label}</span><span class="val">${showVal()}</span>`);
  wrap.appendChild(lab);
  const uw = h('div',{class:'unit-input'});
  const inp = document.createElement('input');
  inp.type='number'; inp.step = step;
  if(min!=null) inp.min=min; if(max!=null) inp.max=max;
  inp.value = isPct ? +(get()*100).toFixed(4) : +(+get()).toFixed(digits!=null ? Math.max(digits,2) : 4);
  uw.appendChild(inp);
  if(suffix){ uw.appendChild(h('span',{class:'suffix'},suffix)); }
  wrap.appendChild(uw);
  inp.addEventListener('input', ()=>{
    let v = parseFloat(inp.value); if(isNaN(v)) return;
    if(isPct) v = v/100;
    set(v);
    lab.querySelector('.val').textContent = showVal();
    onInput && onInput();
    scheduleRender();
  });
  container.appendChild(wrap);
  return inp;
}
function selectField(container, {label, options, get, set, onChange}){
  const wrap = h('div',{class:'field'});
  wrap.appendChild(h('label',{},`<span>${label}</span>`));
  const sel = document.createElement('select');
  options.forEach(o=>{
    const opt = document.createElement('option');
    opt.value=o.value; opt.textContent=o.label;
    if(o.value===get()) opt.selected=true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', ()=>{ set(sel.value); onChange&&onChange(); scheduleRender(); });
  wrap.appendChild(sel);
  container.appendChild(wrap);
  return sel;
}
function toggleField(container, {label, get, set}){
  const lab = h('label',{class:'toggle-row'});
  const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = !!get();
  lab.appendChild(cb); lab.appendChild(h('span',{},label));
  cb.addEventListener('change', ()=>{ set(cb.checked); renderSidebar(); scheduleRender(); });
  container.appendChild(lab);
}


let _downloadsCap;
async function getDownloadsCap(){
  if(_downloadsCap !== undefined) return _downloadsCap;
  try{
    _downloadsCap = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null;
  }catch(e){ _downloadsCap = null; }
  return _downloadsCap;
}
function ioStatusMsg(msg, kind){
  const e = document.getElementById('ioStatus'); if(!e) return;
  e.textContent = msg; e.className = 'io-status' + (kind ? ' '+kind : '');
  if(msg) setTimeout(()=>{ if(e.textContent===msg){ e.textContent=''; e.className='io-status'; } }, 5000);
}
async function saveFile(filename, dataStr, mimeType){
  const cap = await getDownloadsCap();
  if(cap){
    try{ await cap.save({filename, data: dataStr}); ioStatusMsg('Saved '+filename, 'ok'); return; }
    catch(err){ if(err && err.code === 'declined') return; }
  }
  try{
    const blob = new Blob([dataStr], {type: mimeType || 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    ioStatusMsg('Saved '+filename, 'ok');
  }catch(err){ ioStatusMsg('Could not save file — try again.', 'err'); }
}
function numOr(v, fallback){ return (typeof v === 'number' && isFinite(v)) ? v : fallback; }


function csvEscape(v){ const s = String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

function statCard(lbl, value, {foot='', color=null, pill=null}={}){

}

<script>
/* ============================== CONSTANTS & HELPERS ============================== */
const AC_PER_HA=2.47105, MM_PER_IN=25.4;
const TAGS={fixed:'Fixed', yield:'∝ Yield', water:'∝ Irrigation'};
const TAG_FROM_TEXT=t=>{ t=(t||'').toLowerCase(); return t.includes('yield')?'yield':(t.includes('irrig')||t.includes('water'))?'water':'fixed'; };
const GROUPS={op:'Operating costs', cash:'Cash overhead', noncash:'Non-cash overhead (capital recovery)'};

const YIELD_CATS=/^(Assessments?|Harvest|Harvest Aids|Land Rent \(share)/i, WATER_CATS=/^(Irrigation|Water)$/i;
const $=id=>document.getElementById(id);
const INFO=[
 [/assess/i, `<b>Assessment</b><br>Mandatory fees on the crop sold, funding commodity boards, research, grading/inspection and state pest programs. Tomato study: PTAB $0.29/t, CTGA $0.25/t, CTRI $0.12/t, CDFA curly-top program $0.04/t.<br><br><b>Why ∝ Yield:</b> charged per unit sold, so more yield means more fees (+5% yield → +5% assessment). Set to Fixed if yours is charged per acre.`],
 [/rent/i, `<b>Land rent</b><br><b>Share rent</b> (tomato study): the landowner receives a share of the crop — 12% × $138/t = $16.56 per ton. More yield means more rent, so the line is ∝ Yield.<br><br><b>Cash rent</b> (most other studies): a fixed $/acre that doesn't change with yield — keep it Fixed.`]];
function infoBtn(name){ const m=INFO.find(([re])=>re.test(name||'')); if(!m) return null; const b=document.createElement('span'); b.className='info'; b.textContent='i'; bindTip(b,m[1]); b.addEventListener('click',e=>{ showTip(e,m[1]); e.stopPropagation(); }); return b; }
const money=(v,c)=>Number.isFinite(v)?fmt$(v,{cents:c}):'—';
const perL=v=>Number.isFinite(v)?(Math.abs(v)<100?fmt$(v,{cents:true}):fmt$(v))+'/L':'—';
const pct=(v,d=0)=>Number.isFinite(v)?(v>10?'>1000%':fmtPct(v,d)):'—';
function toast(m){ const t=$('toast'); t.textContent=m; t.style.opacity=1; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.opacity=0,2200); }

const csvRow=a=>a.map(v=>typeof v==='number'?(Number.isFinite(v)?+v.toFixed(4):''):csvEscape(v==null?'':v)).join(',');
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"'; i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cell); cell=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function pickFile(accept, cb){ const f=$('fileIn'); f.accept=accept; f.value=''; f.onchange=()=>{ const file=f.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>cb(r.result,file.name); r.readAsText(file); }; f.click(); }
const store={ get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } } };

/* ============================== STUDY DATA ============================== */
const studyKey=s=>s.u.split('/').pop();
const studyYield=s=> s.y?{qty:s.y[0],unit:s.y[1]}:(()=>{ const q=s.g.filter(x=>x[1]!=null); return q.length?{qty:q[0][1],unit:q[0][2]}:{qty:null,unit:''}; })();
const studyGross=s=>s.g.reduce((a,[n,q,u,p])=>a+(q==null?p:q*p),0);
function studyCats(s){
  const cats=(CATS[studyKey(s)]||[]).reduce((m,[n,v])=>{ if(v>0) m.set(n,(m.get(n)||0)+v); return m; }, new Map());
  const rows=[]; let sum=0;
  if(cats.size){ for(const [n,v] of cats){ sum+=v; rows.push({group:'op',name:n,value:v,tag:WATER_CATS.test(n)?'water':(YIELD_CATS.test(n)?'yield':'fixed')}); } }
  else if(s.wCost>0){ rows.push({group:'op',name:'Irrigation water',value:s.wCost,tag:'water'}); sum+=s.wCost; }
  const res=s.op-s.int-sum;

  if(!rows.some(r=>r.tag==='water')) rows.push({group:'op',name:'Irrigation water',value:0,tag:'water'});

}

    costs:studyCats(s).map(r=>({id:nid(),...r})),
    waterIn:s.wIn||0, studyRate:s.rate, crRate:s.crRate, note:[s.yNote,s.note].filter(Boolean).join(' ') };
}
const bVal=r=>r.qty==null?(+r.value||0):(+r.qty||0)*(+r.price||0);

/* ============================== STATE ============================== */

let control=controlFromStudy(STUDIES.findIndex(s=>/Processing, sub-surface drip, Sacramento/.test(s.l)));
const newAlt=n=>({id:nid(), name:'Alternative '+n, yieldPct:5, irrPct:-10, mode:'acre', amount:6, ppm:100, share:100, price:15, ov:{}});
let alts=[newAlt(1)];

/* ============================== ENGINE (per acre) ============================== */
function litres(a){ if(a.mode==='acre') return +a.amount||0; const mm=control.waterIn*(1+a.irrPct/100)*MM_PER_IN*((a.share??100)/100); return (+a.ppm||0)*mm*10/AC_PER_HA/1000; }
function column(a){
  const y=a?a.yieldPct/100:0, w=a?a.irrPct/100:0;
  const v={}; let B=0, C=0;
  control.benefits.forEach(r=>{ let x=bVal(r)*(r.tag==='yield'?1+y:1); if(a&&a.ov[r.id]!=null) x=a.ov[r.id]; v[r.id]=x; B+=x; });
  control.costs.forEach(r=>{ const b=+r.value||0; let x=b*(r.tag==='yield'?1+y:r.tag==='water'?1+w:1); if(a&&a.ov[r.id]!=null) x=a.ov[r.id]; v[r.id]=x; C+=x; });
  const q=a?litres(a):0; let T=a?q*a.price:0; if(a&&a.ov.trt!=null) T=a.ov.trt;

}
function econ(a){
  const c0=column(null), c=column(a);

}

/* ---- control sensitivity: y = yield, p = crop price, w = irrigation, o = operating costs (fractions) ---- */
function ctlNet({y=0,p=0,w=0,o=0}={}){
  let B=0,C=0;
  control.benefits.forEach(r=>{ B+=bVal(r)*(r.tag==='yield'?1+y:1)*(1+p); });
  control.costs.forEach(r=>{ C+=(+r.value||0)*(r.tag==='yield'?1+y:1)*(r.tag==='water'?1+w:1)*(r.group==='op'?1+o:1); });
  return B-C;
}
const CTL_VARS=[

    if(k==='w') return {v:sg, s:`${fmtNum(control.waterIn*(1+x),1)} in · ${fmtNum(control.waterIn*(1+x)*MM_PER_IN,0)} mm`};
    return {v:sg, s:`${money(control.costs.filter(r=>r.group==='op').reduce((a,r)=>a+(+r.value||0),0)*(1+x))}/acre operating`}; };
  const k=h('div',{class:'kpis'});
  k.appendChild(h('div',{class:'kpi',style:`--c:${CTL_COLOR}`},`<div class="t">Control net return</div><div class="big ${N0<0?'neg':'pos'}">${money(N0)}</div><div class="sub">$/acre·yr · ${control.title}</div>`));
  CTL_VARS.forEach(v=>{ const b=fmtBE(v.k); k.appendChild(h('div',{class:'kpi',style:`--c:${v.c}`},`<div class="t">${v.l}</div><div class="big">${b.v}</div><div class="sub">change to break even · ${b.s}</div>`)); });
  P.appendChild(k);
  const g=h('div',{class:'grid2'}); P.appendChild(g);
  const c1=h('div',{class:'card'}); c1.innerHTML='<h3>Net return vs. change in each factor</h3>'; const b1=h('div',{}); c1.appendChild(b1);
  c1.insertAdjacentHTML('beforeend',`<div class="legend">${CTL_VARS.map(v=>`<span><i style="background:${v.c}"></i>${v.l}</span>`).join('')}</div>`); g.appendChild(c1);
  const c2=h('div',{class:'card'}); c2.innerHTML='<h3>Impact of ±20%</h3>'; const b2=h('div',{}); c2.appendChild(b2); g.appendChild(c2);
  const xs=Array.from({length:13},(_,i)=>-0.3+i*0.05);
  drawLines(b1,{xs, series:CTL_VARS.map(v=>({name:v.l,ys:xs.map(x=>ctlNet({[v.k]:x})),color:v.c})), xFmt:v=>(v>0?'+':'')+Math.round(v*100)+'%', xLabel:'Change from study value', baseX:0});
  // tornado
  const rows=CTL_VARS.map(v=>({l:v.l,c:v.c,lo:ctlNet({[v.k]:-0.2})-N0,hi:ctlNet({[v.k]:0.2})-N0})).sort((a,b)=>Math.abs(b.hi-b.lo)-Math.abs(a.hi-a.lo));
  const W=b2.clientWidth||560, rh=46, M={l:118,r:20,t:8,b:28}, H=M.t+M.b+rows.length*rh, iw=W-M.l-M.r, mx=Math.max(...rows.map(r=>Math.max(Math.abs(r.lo),Math.abs(r.hi))),1);
  const X=v=>M.l+iw/2+v/mx*(iw/2-58);
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('width','100%'); svg.setAttribute('height',H); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.appendChild(el('line',{x1:X(0),x2:X(0),y1:M.t,y2:H-M.b,stroke:'var(--muted)','stroke-width':1.2}));
  rows.forEach((r,i)=>{ const cy=M.t+i*rh+rh/2;
    svg.appendChild(textEl(M.l-10,cy+4,r.l,{'text-anchor':'end','font-size':12.5,'font-weight':600,fill:'var(--ink)'}));
    [[r.lo,'−20%',-1],[r.hi,'+20%',1]].forEach(([d,lab,sgn])=>{ const x0=Math.min(X(0),X(d)), w=Math.max(Math.abs(X(d)-X(0)),1.5);
      const rc=el('rect',{x:x0,y:cy-(sgn<0?13:0),width:w,height:12,rx:3,fill:d<0?'var(--div-neg)':'var(--div-pos)'}); bindTip(rc,`<b>${r.l} ${lab}</b><br>${d>=0?'+':''}${fmt$(d)}/acre·yr`); svg.appendChild(rc);
      svg.appendChild(textEl(X(d)+(d<0?-5:5),cy+(sgn<0?-3:10),(d>=0?'+':'')+fmt$(d,{compact:true}),{'text-anchor':d<0?'end':'start','font-size':10.5,fill:'var(--ink-soft)'})); }); });
  svg.appendChild(textEl(X(0),H-8,'change in net return, $/acre·yr',{'text-anchor':'middle','font-size':10.5,fill:'var(--muted)'}));
  b2.appendChild(svg);
  c2.insertAdjacentHTML('beforeend','<div class="legend"><span>Upper bar: factor −20%</span><span>Lower bar: factor +20%</span><span><i style="background:var(--div-pos)"></i>gain</span><span><i style="background:var(--div-neg)"></i>loss</span></div>');
  // table
  const steps=[-0.3,-0.2,-0.1,0,0.1,0.2,0.3];
  const t=h('div',{class:'card'}); t.innerHTML='<h3>Net return ($/acre·yr) <span class="sp"></span><button class="btn" id="csExp">Export CSV</button></h3>';
  t.insertAdjacentHTML('beforeend',`<div class="table-wrap"><table class="t"><thead><tr><th class="l">Change</th>${CTL_VARS.map(v=>`<th style="color:${v.c}">${v.l}</th>`).join('')}</tr></thead><tbody>${
    steps.map(x=>`<tr class="${x===0?'aev':''}"><td class="l">${x===0?'Study value':(x>0?'+':'')+Math.round(x*100)+'%'}</td>${CTL_VARS.map(v=>{ const n=ctlNet({[v.k]:x}); return `<td class="${n<0?'neg':''}">${money(n)}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`);
  P.appendChild(t);
  t.querySelector('#csExp').onclick=()=>{ const L=[csvRow(['Change',...CTL_VARS.map(v=>v.l+' — net return $/acre')])]; steps.forEach(x=>L.push(csvRow([x,...CTL_VARS.map(v=>ctlNet({[v.k]:x}))])));
    L.push(''); L.push(csvRow(['Break-even change',...CTL_VARS.map(v=>be[v.k])])); L.push(csvRow(['Control study',control.title])); saveFile('control-sensitivity.csv',L.join('\n'),'text/csv'); };
  // heatmap yield x price
  const hm=h('div',{class:'card'}); hm.innerHTML='<h3>Yield × crop price</h3>'; const hb=h('div',{}); hm.appendChild(hb); P.appendChild(hm);
  const ax=Array.from({length:13},(_,i)=>-0.3+i*0.05), ay=Array.from({length:9},(_,i)=>-0.3+i*0.075);
  drawHeatmap(hb,{xs:ax, ys:ay, z:ay.map(p=>ax.map(y=>ctlNet({y,p}))), xFmt:v=>(v>0?'+':'')+Math.round(v*100)+'%'+(main?' · '+fmtNum(main.qty*(1+v),main.qty<100?1:0):''), yFmt:v=>(v>0?'+':'')+fmtNum(v*100,1)+'%'+(main?' · $'+fmtNum(main.price*(1+v),main.price<20?2:0):''), xLabel:'Yield change'+(main?` (${main.unit}/acre)`:''), yLabel:'Crop price'+(main?` ($/${main.unit})`:''), baseX:0, baseY:0});
}
function renderSens(){
  const P=$('p-sens'); P.innerHTML='';
  sensSwitch(P);
  if(sensMode==='control'){ renderCtlSens(P); return; }
  const legend=()=>`<div class="legend">${alts.map((a,i)=>`<span><i style="background:${ALT_COLORS[i]}"></i>${a.name}</span>`).join('')}</div>`;
  const chart=(title,xs,fn,xFmt,xLabel,cur)=>{ const c=h('div',{class:'card'}); c.innerHTML=`<h3>${title}</h3>`; const b=h('div',{}); c.appendChild(b); c.insertAdjacentHTML('beforeend',legend()); P.appendChild(c);
    drawLines(b,{xs, series:alts.map((a,i)=>({name:a.name,ys:xs.map(x=>fn(a,x)),color:ALT_COLORS[i]})), xFmt, xLabel, yFmt:v=>fmt$(v,{compact:true}), markers:cur?[{x:cur,label:'current',color:'var(--accent-ink)'}]:[]}); };
  const g=h('div',{class:'grid2'}); P.appendChild(g);
  const holder=P; const tmpP=[];
  const ys=Array.from({length:21},(_,i)=>-10+i*1.5);
  chart('Δ net return vs. yield change',ys,(a,x)=>econ({...a,yieldPct:x}).dAEV,v=>fmtNum(v,0)+'%','Yield change (%)');
  const ws=Array.from({length:21},(_,i)=>-50+i*4);
  chart('Δ net return vs. irrigation change',ws,(a,x)=>econ({...a,irrPct:x}).dAEV,v=>fmtNum(v,0)+'%','Irrigation change (%)');
  const pMax=Math.max(...alts.map(a=>Math.max(a.price*2, Number.isFinite(econ(a).breakEven)?econ(a).breakEven*1.3:0)),5);
  const ps=Array.from({length:21},(_,i)=>pMax*i/20);
  chart('Δ net return vs. product price',ps,(a,x)=>econ({...a,price:x}).dAEV,v=>'$'+(v<10?v.toFixed(1):v.toFixed(0)),'Product price ($/L)');
  // move the three line cards into a cleaner layout: first two side by side
  const cards=[...P.querySelectorAll(':scope > .card')]; g.append(cards[0],cards[1]); drawAgain(cards);
  // heatmap
  const hm=h('div',{class:'card'}); hm.innerHTML='<h3>Yield change × product price</h3>'; const tabs=h('div',{class:'tabsm'}); hm.appendChild(tabs); const box=h('div',{}); hm.appendChild(box); P.appendChild(hm);
  if(hmSel>=alts.length) hmSel=0;
  const draw=()=>{ tabs.innerHTML=''; alts.forEach((a,i)=>{ const b=h('button',{class:i===hmSel?'on':''},a.name); b.onclick=()=>{ hmSel=i; draw(); }; tabs.appendChild(b); });
    const a=alts[hmSel]; const xs=withBase(Array.from({length:11},(_,i)=>-5+i*2.5),a.yieldPct), pp=withBase(Array.from({length:9},(_,i)=>pMax*i/8),a.price);
    drawHeatmap(box,{xs, ys:pp, z:pp.map(p=>xs.map(y=>econ({...a,yieldPct:y,price:p}).dAEV)), xFmt:v=>fmtNum(v,1)+'%', yFmt:v=>'$'+(v<10?v.toFixed(1):v.toFixed(0)), xLabel:'Yield change', yLabel:'Product price ($/L)', baseX:a.yieldPct, baseY:a.price}); };
  draw();
}
function drawAgain(cards){ /* charts were drawn before being moved into the 2-column grid; redraw for correct width */
  const fns=[['Δ net return vs. yield change',Array.from({length:21},(_,i)=>-10+i*1.5),'yieldPct',v=>fmtNum(v,0)+'%','Yield change (%)'],['Δ net return vs. irrigation change',Array.from({length:21},(_,i)=>-50+i*4),'irrPct',v=>fmtNum(v,0)+'%','Irrigation change (%)']];
  fns.forEach(([t,xs,key,xf,xl],i)=>{ const b=cards[i].querySelector('div'); drawLines(b,{xs, series:alts.map((a,j)=>({name:a.name,ys:xs.map(x=>econ({...a,[key]:x}).dAEV),color:ALT_COLORS[j]})), xFmt:xf, xLabel:xl, markers:alts.map((a,j)=>({x:a[key],label:'',color:ALT_COLORS[j]}))}); });
}
const withBase=(arr,v)=>{ if(!arr.some(a=>Math.abs(a-v)<1e-9)) arr.push(v); return arr.sort((a,b)=>a-b); };

/* ============================== LIBRARY ============================== */
let libQ='';
function renderLib(){
  const P=$('p-lib'); P.innerHTML='';
  const c=h('div',{class:'card'}); c.innerHTML=`<h3>UC Davis cost &amp; return studies <span class="sp"></span><input class="filter" id="lq" placeholder="Filter…"><button class="btn pri" id="l1">Export CSV</button><button class="btn" id="l2">Export all line items</button></h3>`;
  const w=h('div',{class:'table-wrap'}); c.appendChild(w); P.appendChild(c);
  const q=c.querySelector('#lq'); q.value=libQ;
  const rows=()=>STUDIES.map((s,i)=>{ const y=studyYield(s), G0=studyGross(s), T=s.op+s.cash+s.non; return {i,s,y,G0,T}; });
  const draw=()=>{ const f=libQ.toLowerCase();
    w.innerHTML=`<table class="t lib"><thead><tr><th class="l">Crop</th><th class="l">Study</th><th>Yield /ac</th><th class="l">Unit</th><th>Water (in)</th><th>Water (mm)</th><th>Gross $/ac</th><th>Operating</th><th>Cash OH</th><th>Non-cash OH</th><th>Total cost</th><th>Net</th><th>Op. rate</th><th>CR rate</th></tr></thead><tbody>${
      rows().filter(r=>!f||(r.s.c+' '+r.s.l).toLowerCase().includes(f)).map(r=>`<tr data-i="${r.i}" class="${r.i===control.studyIdx?'cur':''}"><td class="l">${r.s.c}</td><td class="l" style="white-space:normal;min-width:230px">${r.s.l}</td><td>${r.y.qty!=null?fmtNum(r.y.qty,r.y.qty<100?2:0):'—'}</td><td class="l">${r.y.unit}</td><td>${r.s.wIn?fmtNum(r.s.wIn,2):'—'}</td><td>${r.s.wIn?fmtNum(r.s.wIn*MM_PER_IN,0):'—'}</td><td>${money(r.G0)}</td><td>${money(r.s.op)}</td><td>${money(r.s.cash)}</td><td>${money(r.s.non)}</td><td>${money(r.T)}</td><td class="${r.G0-r.T<0?'neg':''}">${money(r.G0-r.T)}</td><td>${fmtPct(r.s.rate,2)}</td><td>${r.s.crRate!=null?fmtPct(r.s.crRate,2):'—'}</td></tr>`).join('')}</tbody></table>`;
    w.querySelectorAll('tr[data-i]').forEach(t=>t.onclick=()=>{ control=controlFromStudy(+t.dataset.i); alts.forEach(a=>a.ov={}); go('control'); }); };
  q.oninput=()=>{ libQ=q.value; draw(); }; draw();
  c.querySelector('#l1').onclick=()=>{ const L=[csvRow(['Crop','Study','Yield per acre','Yield unit','Irrigation water (in)','Irrigation water (mm)','Gross return $/acre','Operating costs $/acre','Interest on operating capital $/acre','Cash overhead $/acre','Non-cash overhead $/acre','Total cost $/acre','Net return $/acre','Operating interest rate','Capital recovery rate','Notes','Study PDF'])];
    rows().forEach(({s,y,G0,T})=>L.push(csvRow([s.c,s.l,y.qty,y.unit,s.wIn||null,s.wIn?s.wIn*MM_PER_IN:null,G0,s.op,s.int,s.cash,s.non,T,G0-T,s.rate,s.crRate,[s.yNote,s.wNote,s.note].filter(Boolean).join(' '),s.u])));
    saveFile('uc-davis-cost-studies.csv',L.join('\n'),'text/csv'); };
  c.querySelector('#l2').onclick=()=>{ const L=[csvRow(['Crop','Study','Type','Group','Item','Quantity per acre','Unit','Price per unit','$/acre','$/ha','Responds to'])];
    STUDIES.forEach((s,i)=>{ const ct=controlFromStudy(i); ct.benefits.forEach(r=>L.push(csvRow([s.c,s.l,'Benefit','Gross revenue',r.name,r.qty,r.unit,r.price,bVal(r),bVal(r)*AC_PER_HA,TAGS[r.tag]]))); ct.costs.forEach(r=>L.push(csvRow([s.c,s.l,'Cost',GROUPS[r.group],r.name,'','','',r.value,r.value*AC_PER_HA,TAGS[r.tag]]))); });
    saveFile('uc-davis-cost-studies-line-items.csv',L.join('\n'),'text/csv'); };
}

/* ============================== NAV ============================== */
let page='control';
const PAGES={control:renderControl, alts:renderAlts, econ:renderEcon, sens:renderSens, lib:renderLib};
function go(p){ page=p; document.querySelectorAll('#steps button').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); document.querySelectorAll('.page').forEach(s=>s.classList.toggle('on',s.id==='p-'+p)); PAGES[p](); window.scrollTo({top:0}); }
document.querySelectorAll('#steps button').forEach(b=>b.onclick=()=>go(b.dataset.p));
let _rs; window.addEventListener('resize',()=>{ clearTimeout(_rs); _rs=setTimeout(()=>{ if(page==='econ'||page==='sens') PAGES[page](); },150); });
go('control');
</script>
